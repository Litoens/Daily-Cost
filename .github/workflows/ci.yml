name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job id `check` is required by branch protection; do not rename.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS syntax
        run: for f in js/*.js tests/*.mjs tests/e2e/*.mjs; do node --check "$f"; done
      - name: Lint
        run: npx --yes eslint@9 .
      - name: HTML and id wiring
        run: node tests/check.mjs
      - name: Unit tests with coverage
        run: node --test --experimental-test-coverage tests/*.test.mjs
      - name: Performance budget
        run: node tests/budget.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and axe-core
        run: npm install --no-save --no-package-lock --prefix tests/e2e playwright@1.49.1 @axe-core/playwright@4.10.1
      - name: Install Chromium
        run: npx --yes playwright@1.49.1 install --with-deps chromium
      - name: Browser smoke and accessibility test
        run: node tests/e2e/smoke.mjs

  deploy:
    # Runs only on main, and only if the checks above passed.
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          for p in index.html 404.html sw.js icon.svg manifest.webmanifest css js icons; do
            if [ -e "$p" ]; then cp -r "$p" _site/; else echo "skipping missing $p"; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the live site
        env:
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o page.html -w '%{http_code}' -L "$URL" || true)
            if [ "$code" = "200" ] && grep -q "Daily Cost Tracker" page.html; then
              echo "OK: $URL returned 200 with expected content"; exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying in 10s"; sleep 10
          done
          echo "Smoke test failed for $URL"; exit 1
